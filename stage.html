<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; font-src 'self'; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Kin — frame</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="stage-window">
  <div class="frame-drag" aria-hidden="true"></div>

  <main class="frame" id="frame">
    <div class="frame-status" id="frame-status" data-tone="muted">
      <span class="dot"></span>
      <span id="frame-status-label">Waiting for studio</span>
    </div>

    <div id="stage-portrait" class="portrait"></div>

    <div class="frame-controls">
      <button id="frame-fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        </svg>
      </button>
      <button id="frame-close" type="button" aria-label="Close the frame window" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <div class="frame-chips" aria-hidden="true">
      <div class="frame-chip"><span>Pulse</span><strong id="frame-pulse">—</strong></div>
      <div class="frame-chip"><span>Breath</span><strong id="frame-breath">—</strong></div>
      <div class="frame-chip"><span>Expression</span><strong id="frame-expression">—</strong></div>
    </div>
  </main>

  <script src="dist/stage.js"></script>
</body>
</html>
